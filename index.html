<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>河狸数能 · 您身边的能源帮手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6FA;--fg:#0B0B18;--mut:#5b5f72;--card:#fff;--line:#e1e3ec;--o:#FF6A13;--o2:#E8330C;--ink:#07070F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A14;--fg:#F2F2F7;--mut:#9aa0b4;--card:#12121f;--line:#25253b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0A14;--fg:#F2F2F7;--mut:#9aa0b4;--card:#12121f;--line:#25253b;color-scheme:dark}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:16px/1.75 "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}.wrap{max-width:min(1480px,92vw);margin:auto;padding:0 24px}
nav{position:fixed;inset:0 0 auto;z-index:20;padding:env(safe-area-inset-top,0px) 0 0;background:rgba(7,7,15,.62);backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.br{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}.br img{width:28px;height:27px;object-fit:contain}
.lks{display:flex;gap:6px;align-items:center}.lks a{padding:6px 14px;border-radius:99px;font-size:15px;opacity:.78;transition:.25s}
.lks a:hover,.lks a.on{opacity:1;background:rgba(255,255,255,.12)}.lks a.cta{background:var(--o);opacity:1;font-weight:700}
.dk{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.dk canvas{position:absolute;inset:0;width:100%;height:100%}
.hero{min-height:100vh;display:flex;align-items:center;padding:110px 0 70px}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center;width:100%}
h1{font-size:clamp(42px,7vw,104px);font-weight:900;line-height:1.08;letter-spacing:-.02em}
h1 i{font-style:normal;display:inline-block;opacity:0;transform:translateY(.5em) rotate(4deg);animation:ch .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ch{to{opacity:1;transform:none}}
h1 em{font-style:normal;color:#FF7A1F}
.lead{max-width:34em;margin:26px 0 34px;color:#c9ccdb;font-size:18px;opacity:0;animation:ch 1s .9s forwards}
.btns{display:flex;flex-wrap:wrap;gap:14px;opacity:0;animation:ch 1s 1.15s forwards}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:700;padding:13px 28px;border-radius:99px;transition:.3s}
.pri{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;box-shadow:0 8px 30px -8px var(--o)}.pri:hover{transform:translateY(-3px);box-shadow:0 14px 40px -8px var(--o)}
.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}.ghost:hover{background:var(--o);border-color:var(--o);color:#fff}
.mascot{position:relative;display:grid;place-items:center}
.mascot img{width:min(100%,330px);position:relative;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 24px 46px rgba(255,90,20,.34))}
.mascot b{position:absolute;width:70%;aspect-ratio:1;border:1.5px solid rgba(255,106,19,.5);border-radius:50%;animation:rg 4s infinite}.mascot b:nth-child(2){animation-delay:2s}
@keyframes fl{50%{transform:translateY(-18px) rotate(-2deg)}}@keyframes rg{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.hero.dk{background:linear-gradient(180deg,#1d1440 0%,#4a1d5c 36%,#b23a14 76%,#ff7a1f 100%)}
.hero .wrap{max-width:1320px;z-index:2;grid-template-columns:1.2fr .8fr}
.hero h1{font-size:clamp(44px,6.8vw,104px);text-wrap:balance;text-shadow:0 4px 40px rgba(29,20,64,.35)}
.hero h1 em{color:#FFC48A}.hero .lead{color:rgba(255,255,255,.84)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.7;animation:bl 14s ease-in-out infinite alternate}
.b1{width:560px;height:560px;left:-140px;top:-140px;background:#6d3bff}.b2{width:640px;height:640px;right:-180px;bottom:-220px;background:#ff5a14}.b3{width:420px;height:420px;left:40%;top:28%;background:#ff9d4a;opacity:.4;animation-duration:19s}
@keyframes bl{to{transform:translate(90px,60px) scale(1.18)}}
#mc{transition:transform .25s ease-out}#hc{will-change:transform}
.hero .mascot::before{content:"";position:absolute;width:86%;aspect-ratio:1;border-radius:50%;background:radial-gradient(rgba(255,255,255,.42),rgba(255,255,255,0) 68%)}
.hero .mascot img{width:min(92%,360px);filter:drop-shadow(0 30px 42px rgba(29,10,60,.42))}
.hero .mascot b{border-color:rgba(255,255,255,.5)}
.gl{position:absolute;z-index:3;padding:10px 18px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.3);font-weight:700;font-size:14px;color:#fff;box-shadow:0 14px 40px rgba(29,10,60,.25);animation:fl 7s ease-in-out infinite}
.sc{position:absolute;left:50%;bottom:26px;width:26px;height:44px;border:2px solid rgba(255,255,255,.65);border-radius:14px;transform:translateX(-50%);z-index:2}
.sc::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:sc 1.8s infinite}@keyframes sc{to{transform:translateY(14px);opacity:0}}
@media(max-width:860px){.gl{display:none}.sc{display:none}}
.hz{position:relative;background:var(--bg)}
/* ===== 首页首屏 v22：左文右卡，响应式自适应 ===== */
.hero2{padding:clamp(90px,10vh,140px) 0 clamp(36px,4vh,56px);position:relative;min-height:calc(100vh - 69px);display:flex;flex-direction:column}
.hero2-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(40px,5vw,84px);align-items:center;max-width:min(1400px,94vw);margin:auto;flex:1;width:100%}
.hero2-eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--o)}
.hero2-copy h1{margin-top:18px;font-size:clamp(34px,3.4vw,54px);line-height:1.12;letter-spacing:-.015em;color:#10111a;font-weight:800;text-wrap:balance}
.hero2-copy h1 em{font-style:normal;background:linear-gradient(120deg,#ff7a24 0%,#f04a16 88%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.hero2-desc{margin-top:24px;max-width:34em;font-size:clamp(14px,1.05vw,16px);line-height:1.9;color:#4d5261}
.hero2-btns{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap}
.hero2-btns .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;transition:.25s}
.hero2-btns .btn i{font-style:normal;transition:transform .25s}
.hero2-btns .btn:hover i{transform:translateX(3px)}
.hero2-btns .btn.pri{background:var(--o);color:#fff;box-shadow:0 8px 22px -8px rgba(255,106,19,.5)}
.hero2-btns .btn.pri:hover{background:#e55a0d;transform:translateY(-2px)}
.hero2-btns .btn.sec{background:#fff;color:#171925;border:1px solid #e3e6ee}
.hero2-btns .btn.sec:hover{border-color:#c9cddb;transform:translateY(-2px)}
.hero2-contact{display:inline-block;margin-top:20px;font-size:14px;color:#8a8f9e;text-decoration:none}
.hero2-contact b{color:#4d5261;font-weight:600;margin-left:8px;transition:.25s}
.hero2-contact:hover b{color:var(--o)}
.hero2-cards{display:flex;flex-direction:column;gap:clamp(14px,1.6vw,20px)}
.hero2-card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #eceef3;border-radius:16px;padding:clamp(18px,1.8vw,24px) clamp(20px,2vw,28px);text-decoration:none;box-shadow:0 6px 24px -14px rgba(20,24,38,.12);transition:.3s}
.hero2-card:hover{transform:translateX(6px);box-shadow:0 12px 32px -14px rgba(20,24,38,.18);border-color:#e0e3ec}
.hero2-card:nth-of-type(1){margin-right:12%}
.hero2-card:nth-of-type(2){margin-left:6%;margin-right:6%}
.hero2-card:nth-of-type(3){margin-left:12%}
.hero2-card-no{font-size:12px;font-weight:800;color:var(--o);letter-spacing:.05em;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.hero2-card-no em{font-style:normal;font-weight:600;color:#9ba0ac;font-size:11px;letter-spacing:.02em}
.hero2-card b{flex:1;font-size:clamp(15px,1.2vw,17px);font-weight:700;color:#171925}
.hero2-card i{font-style:normal;color:#c4c9d4;font-size:18px;transition:.25s}
.hero2-card:hover i{color:var(--o);transform:translateX(3px)}
.hero2-tags{display:flex;flex-wrap:wrap;gap:14px 0;margin-top:auto;border-top:1px solid #e8eaf0;padding-top:22px;padding-bottom:8px;max-width:min(1400px,94vw);margin-left:auto;margin-right:auto;width:100%}
.hero2-tags span{flex:1 1 0;min-width:140px;font-size:13px;color:#8a8f9e;letter-spacing:.02em;text-align:left}
@media(max-width:1100px){.hero2-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px}.hero2-card:nth-of-type(n){margin-left:0;margin-right:0}}
@media(max-width:900px){.hero2{padding-top:120px}.hero2-grid{grid-template-columns:1fr;gap:48px}.hero2-copy h1{font-size:clamp(32px,7vw,46px)}.hero2-desc{max-width:none}.hero2-tags span{flex:1 1 45%;min-width:0}}
@media(max-width:520px){.hero2-btns .btn{width:100%;justify-content:center}.hero2-tags span{flex:1 1 100%}}
.hs{position:relative}
.tx{position:relative;z-index:3;text-align:center;padding:calc(104px + env(safe-area-inset-top,0px)) 24px 0;will-change:transform,opacity}
.hz .lead{color:var(--mut);margin:22px auto 30px;max-width:30em;font-size:clamp(15px,1.5vw,19px)}
.hz .btns{justify-content:center;align-items:center;gap:12px}
.dkb{background:var(--fg);color:var(--bg)}.dkb:hover{transform:translateY(-2px);background:var(--o);color:#fff}
.tl{color:var(--o);padding:13px 12px}.tl:hover{text-decoration:underline}
.energy-bg{position:absolute;inset:0;z-index:0;background:
radial-gradient(520px circle at 50% 76%,rgba(255,106,19,.16),transparent 68%),
linear-gradient(180deg,transparent 0%,rgba(255,255,255,.02) 100%);transition:.4s}
.energy-stage{position:absolute;left:50%;bottom:5vh;width:min(860px,82vw);height:min(540px,56vh);transform:translateX(-50%);z-index:2;will-change:transform,opacity}
.energy-core{position:absolute;left:50%;top:50%;width:190px;height:190px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.88);border:1px solid rgba(255,106,19,.22);box-shadow:0 30px 90px rgba(255,106,19,.18),inset 0 0 0 12px rgba(255,106,19,.04);backdrop-filter:blur(18px)}
.energy-core::before,.energy-core::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,106,19,.18);animation:ecPulse 4.8s ease-out infinite}
.energy-core::before{inset:-34px}.energy-core::after{inset:-72px;animation-delay:1.5s}
@keyframes ecPulse{0%,20%{transform:scale(.88);opacity:0}45%{opacity:.8}100%{transform:scale(1.08);opacity:0}}
.energy-core img{width:104px;height:98px;object-fit:contain;filter:drop-shadow(0 14px 20px rgba(255,90,20,.18))}
.energy-core small{position:absolute;bottom:24px;font-size:12px;letter-spacing:.12em;color:#7a7e8e;font-weight:700}
.energy-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.energy-lines path{fill:none;stroke:rgba(255,106,19,.25);stroke-width:1.5;stroke-dasharray:7 10;animation:dashFlow 7s linear infinite}
.energy-lines path:nth-child(2){animation-duration:8.5s}.energy-lines path:nth-child(3){animation-duration:6.6s}.energy-lines path:nth-child(4){animation-duration:9s}
@keyframes dashFlow{to{stroke-dashoffset:-120}}
.enode{position:absolute;width:150px;min-height:88px;padding:15px 16px;border-radius:20px;background:rgba(255,255,255,.82);border:1px solid rgba(20,24,40,.08);box-shadow:0 18px 48px rgba(23,28,44,.10);backdrop-filter:blur(16px);display:flex;gap:12px;align-items:center;transition:.3s;animation:nodeFloat 6s ease-in-out infinite}
.enode:nth-of-type(2){animation-delay:-1.5s}.enode:nth-of-type(3){animation-delay:-3s}.enode:nth-of-type(4){animation-delay:-4.5s}
@keyframes nodeFloat{50%{transform:translateY(-8px)}}
.enode i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,106,19,.09);color:var(--o);flex:0 0 auto}
.enode svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.enode b{display:block;font-size:14px;line-height:1.35}.enode span{display:block;margin-top:4px;color:var(--mut);font-size:12px;white-space:nowrap}
.n1{left:2%;top:10%}.n2{right:2%;top:10%}.n3{left:2%;bottom:9%}.n4{right:2%;bottom:9%}
.energy-tag{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);padding:9px 16px;border-radius:99px;background:rgba(11,11,24,.88);color:#fff;font-size:13px;font-weight:700;letter-spacing:.04em;box-shadow:0 10px 28px rgba(11,11,24,.16)}
.fl2{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--fg);font-size:clamp(34px,6vw,78px);font-weight:900;line-height:1.12;letter-spacing:-.03em;opacity:0;padding:0 24px;pointer-events:none}
.fl2 small{display:block;margin-top:20px;font-size:clamp(14px,1.5vw,18px);font-weight:500;letter-spacing:0;color:var(--mut)}
body[data-p=""] nav{background:color-mix(in srgb,var(--bg) 74%,transparent);color:var(--fg);border-bottom-color:var(--line)}
body[data-p=""] .lks a:hover,body[data-p=""] .lks a.on{background:rgba(127,127,127,.16)}
@media(max-width:860px){.hz{height:220vh}.energy-stage{width:94vw;height:48vh;bottom:7vh}.energy-core{width:146px;height:146px}.energy-core img{width:78px;height:74px}.energy-core small{display:none}.enode{width:126px;min-height:72px;padding:11px}.enode i{width:36px;height:36px}.enode span{display:none}.n1,.n3{left:0}.n2,.n4{right:0}}
@media(prefers-reduced-motion:reduce){.hz{height:auto}.hs{position:relative;height:100vh}.fl2{display:none}.enode,.energy-core::before,.energy-core::after,.energy-lines path{animation:none!important}}
.mq{overflow:hidden;background:#1d1440;color:#fff;padding:14px 0;font-weight:700;white-space:nowrap}
.mq div{display:inline-flex;gap:46px;animation:mq 32s linear infinite;padding-right:46px}@keyframes mq{to{transform:translateX(-50%)}}
section{padding:110px 0}.t2{font-size:clamp(28px,4vw,50px);font-weight:900;line-height:1.25;max-width:20em}.sub{color:var(--mut);max-width:40em;margin-top:18px}
.grid{display:grid;gap:22px;margin-top:48px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px;overflow:hidden;transition:transform .35s,border-color .35s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--x,50%) var(--y,0),rgba(255,106,19,.16),transparent 60%);opacity:0;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:var(--o)}.card:hover::before{opacity:1}.card>*{position:relative}
.card h3{font-size:23px;font-weight:900;margin-bottom:10px}.card p{color:var(--mut)}.card .btn{margin-top:22px}
.ov{cursor:pointer;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#fff}.ov p{color:#c9ccdb}
.lk{display:inline-block;margin-top:20px;color:#FFA466;font-weight:700}.lk::after{content:" ↓";display:inline-block;animation:bn 1.6s infinite}@keyframes bn{50%{transform:translateY(5px)}}
.ph{padding:150px 0 90px}.ph h1{font-size:clamp(34px,5.4vw,70px);max-width:14em}.ph .lead{opacity:1;animation:none}
.path{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pn{border-radius:28px;padding:54px 40px;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;overflow:hidden;transition:.4s}
.pn:hover{transform:translateY(-8px) scale(1.01)}.pn h3{font-size:clamp(24px,3vw,36px);font-weight:900;line-height:1.3;position:relative}.pn p{opacity:.85;margin:14px 0 24px;position:relative}
.pn.a{background:linear-gradient(150deg,#FF8A2B,var(--o2))}.pn.b{background:linear-gradient(150deg,#1b1b33,var(--ink));border:1px solid #2c2c4a}
.pn::after{content:"";position:absolute;width:420px;height:420px;right:-120px;top:-140px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.25),transparent 65%);transition:.6s}.pn:hover::after{transform:scale(1.4)}
.tip{font-size:14px;color:var(--mut);margin-top:14px;padding-left:14px;border-left:3px solid var(--o)}
.big{font-size:44px;font-weight:900;color:var(--o);line-height:1}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:48px;position:relative}
.steps::before{content:"";position:absolute;left:0;top:26px;height:3px;width:100%;background:linear-gradient(90deg,var(--o),var(--o2));transform:scaleX(0);transform-origin:left;transition:transform 1.6s .2s}
.steps.in::before{transform:scaleX(1)}.st{padding-top:62px;position:relative}.st b{position:absolute;top:0;width:54px;height:54px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-size:22px}
.st h4{font-size:21px;font-weight:900}.st p{color:var(--mut);margin-top:8px}
.chart{margin-top:40px;background:var(--ink);border-radius:24px;padding:26px;color:#fff}.chart svg{width:100%;display:block}
.chart path{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1100;stroke-dashoffset:1100;transition:stroke-dashoffset 2.4s}.chart.in path{stroke-dashoffset:0}.chart path:nth-of-type(2){transition-delay:.4s}.chart path:nth-of-type(3){transition-delay:.8s}
.lg{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:#c9ccdb;margin-top:8px}.lg i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:8px;vertical-align:middle}
form{display:grid;gap:20px;max-width:760px;margin-top:40px}label{font-weight:700;font-size:14px;display:grid;gap:8px}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;transition:.25s;width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:none;border-color:var(--o);box-shadow:0 0 0 4px rgba(255,106,19,.22)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips span{padding:9px 20px;border:1.5px solid var(--line);border-radius:99px;cursor:pointer;font-weight:500;transition:.25s}.chips span.on{background:var(--o);border-color:var(--o);color:#fff}
.pre{display:inline-block;background:rgba(255,106,19,.14);color:var(--o);padding:5px 14px;border-radius:99px;font-size:14px;font-weight:700;margin:4px 8px 0 0}
.ok{display:none;padding:22px;border-radius:16px;background:rgba(255,106,19,.12);border:1.5px solid var(--o);font-weight:700}
.err{padding:18px 22px;border-radius:16px;background:rgba(220,53,69,.10);border:1.5px solid #dc3545;font-weight:600;color:#c81e2b;font-size:14px}
.btn.pri:disabled{opacity:.62;cursor:not-allowed;pointer-events:none}
.fcta{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:20px 22px;border-radius:20px;border:1.5px dashed rgba(18,24,42,.16);background:linear-gradient(145deg,#fff,#f8f9fc);transition:border-color .4s,background .4s,box-shadow .5s var(--ease-cine)}
.fcta:hover{border-color:var(--o);background:linear-gradient(145deg,#fff,#fff6f0);box-shadow:0 16px 36px -18px rgba(255,106,19,.34)}
.fcta-copy{min-width:0}
.fcta-copy b{display:block;font-size:15px;color:var(--fg);font-weight:700}
.fcta-copy small{display:block;margin-top:5px;color:#7a7f8d;font-size:13px;line-height:1.7}
.fcta .btn{white-space:nowrap;font-size:13.5px;padding:11px 20px}

/* ===== 克制高级动效：以内容为主，动效为辅 ===== */
:root{--soft-shadow:0 18px 50px rgba(18,25,44,.08);--soft-shadow-hover:0 26px 70px rgba(18,25,44,.12)}

/* 首页：只保留非常轻的环境动效 */
.home-shell::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(720px 440px at 76% 18%,rgba(255,106,19,.08),transparent 64%),
  radial-gradient(540px 360px at 18% 74%,rgba(105,86,255,.045),transparent 66%);
  animation:softGlow 14s ease-in-out infinite alternate}
@keyframes softGlow{to{transform:translate3d(1.5%,-1%,0) scale(1.025);opacity:.86}}

/* 入口卡片：避免夸张 3D，仅做轻微抬升 */
.home-path{box-shadow:var(--soft-shadow);transition:transform .38s cubic-bezier(.2,.8,.2,1),box-shadow .38s ease,border-color .38s ease}
.home-path:hover{transform:translateY(-6px);box-shadow:var(--soft-shadow-hover)}
.home-path-visual{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.home-path:hover .home-path-visual{transform:translateY(-4px) scale(1.018)}
.home-path b i{transition:transform .32s ease,background .32s ease}
.home-path:hover b i{transform:translateX(4px)}

/* 关于我们：强化排版，不堆特效 */
.about-title{letter-spacing:-.045em;text-wrap:balance}
.about-title em{font-style:normal;color:var(--o)}
.about-principle{position:relative;overflow:hidden;box-shadow:var(--soft-shadow)}
.about-principle::after{content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:linear-gradient(90deg,var(--o),#ffb27f);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.about-principle.in::after{width:100%}
.about-cap-item{transition:transform .35s ease,border-color .35s ease,background .35s ease}
.about-cap-item:hover{transform:translateY(-4px);border-color:rgba(255,106,19,.22);background:rgba(255,255,255,.72)}
.about-bottom a{transition:transform .3s ease,color .3s ease}
.about-bottom a:hover{transform:translateX(4px)}

/* 业务页：只保留主视觉轻微漂浮 */
.biz-panel{animation:heroPanelSoft 8s ease-in-out infinite!important}
@keyframes heroPanelSoft{0%,100%{transform:rotateY(-4deg) rotateX(2deg) translateY(0)}50%{transform:rotateY(-2deg) rotateX(1deg) translateY(-5px)}}
.asset-visual .biz-panel{animation:assetPanelSoft 8s ease-in-out infinite!important}
@keyframes assetPanelSoft{0%,100%{transform:rotateY(4deg) rotateX(2deg) translateY(0)}50%{transform:rotateY(2deg) rotateX(1deg) translateY(-5px)}}
.biz-orb{animation:orbSoft 7s ease-in-out infinite!important;opacity:.72}
@keyframes orbSoft{50%{transform:scale(1.035);opacity:.82}}
.float-metric,.asset-node{animation-duration:8s!important}

/* 卡片：统一更干净 */
.card,.sr .art,.contact-card{transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease}
.card:hover,.sr .art:hover{transform:translateY(-5px)}
.contact-card{box-shadow:var(--soft-shadow)}
.contact-card:hover{box-shadow:var(--soft-shadow-hover)}

/* 入场动效：更慢、更克制 */
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv[data-stagger="1"]{transition-delay:.05s}.rv[data-stagger="2"]{transition-delay:.10s}.rv[data-stagger="3"]{transition-delay:.15s}

/* 按钮微反馈 */
.btn{transition:transform .28s ease,box-shadow .28s ease,background .28s ease,border-color .28s ease}
.btn:hover{transform:translateY(-2px)}

/* 轻微滚动进度，不抢视觉 */
#readingProgress{position:fixed;left:0;top:0;width:100%;height:2px;transform-origin:left center;transform:scaleX(0);background:var(--o);z-index:80;opacity:.75;pointer-events:none}

@media(max-width:860px){
  .home-path:hover,.card:hover,.sr .art:hover,.about-cap-item:hover,.btn:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
  .home-shell::before,.biz-panel,.biz-orb,.float-metric,.asset-node{animation:none!important}
  #readingProgress{display:none}
}

/* ===== 叙事型动效系统：以视线引导替代持续炫技 ===== */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-soft:cubic-bezier(.22,.61,.36,1)}

/* 取消持续漂浮，改为进入视口时完成一次“组装” */

.biz-visual{will-change:transform;transition:transform .18s linear}

/* 业务页首屏：分层进入 */
.biz-hero-copy .kicker,.biz-hero-copy h1,.biz-hero-copy .lead,.biz-proof{
  opacity:0;transform:translateY(22px);filter:blur(5px);
  transition:opacity .8s var(--ease-out),transform .9s var(--ease-out),filter .85s var(--ease-out)
}
.biz-hero-grid.motion-in .biz-hero-copy .kicker{opacity:1;transform:none;filter:none;transition-delay:.05s}
.biz-hero-grid.motion-in .biz-hero-copy h1{opacity:1;transform:none;filter:none;transition-delay:.16s}
.biz-hero-grid.motion-in .biz-hero-copy .lead{opacity:1;transform:none;filter:none;transition-delay:.31s}
.biz-hero-grid.motion-in .biz-proof{opacity:1;transform:none;filter:none;transition-delay:.46s}

.biz-orb{opacity:0;transform:scale(.78);filter:blur(10px);transition:opacity 1.2s var(--ease-out),transform 1.4s var(--ease-out),filter 1.2s var(--ease-out)}

/* ===== 电影感升级层 v3：质感 · 动效 · 底图 ===== */
:root{--ease-cine:cubic-bezier(.16,1,.3,1);--ease-soft:cubic-bezier(.22,.61,.36,1)}
/* 胶片颗粒 + 暗角：全站一层极轻的电影质感 */
body::after{content:"";position:fixed;inset:-50%;z-index:9998;pointer-events:none;opacity:.055;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,3%)}80%{transform:translate(3%,-1%)}100%{transform:translate(0,0)}}
body::before{content:"";position:fixed;inset:0;z-index:9997;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 58%,rgba(12,8,24,.09) 100%)}
/* 路由切换：模糊 + 微推进的电影转场 */
@keyframes pageIn{from{opacity:0;filter:blur(14px);scale:1.025}to{opacity:1;filter:blur(0);scale:1}}
#app>*{animation:pageIn 1.1s var(--ease-cine) both}
@keyframes cineUp{from{opacity:0;translate:0 48px;filter:blur(9px)}to{opacity:1;translate:0 0;filter:blur(0)}}
/* 滚动入场：分段、带焦点的错落进入 */
html.cine .cine-stag>*{opacity:0}
html.cine .cine-stag.in>*{animation:cineUp 1.3s var(--ease-cine) both}
html.cine .cine-stag.in>*:nth-child(2){animation-delay:.1s}
html.cine .cine-stag.in>*:nth-child(3){animation-delay:.2s}
html.cine .cine-stag.in>*:nth-child(4){animation-delay:.3s}
html.cine .cine-stag.in>*:nth-child(n+5){animation-delay:.4s}
.rv{transform:translateY(40px);filter:blur(7px);transition:opacity 1.3s var(--ease-cine),transform 1.3s var(--ease-cine),filter 1.3s var(--ease-cine)}
.rv.in{filter:none}
/* 业务页首屏：文字层级依次浮现 */
.biz-hero-copy>*{animation:cineUp 1.4s var(--ease-cine) both}
.biz-hero-copy>*:nth-child(2){animation-delay:.12s}.biz-hero-copy>*:nth-child(3){animation-delay:.24s}.biz-hero-copy>*:nth-child(n+4){animation-delay:.36s}
/* 首页主标题：渐变光带缓慢流动 */
.home-intro h1 em{background-size:200% 100%;animation:emShine 7s ease-in-out infinite alternate}
@keyframes emShine{from{background-position:0% 50%}to{background-position:100% 50%}}
/* 底图：关于 / 联系页的电影式光斑漫游 */
.about-home::after,.contact-page::after{content:"";position:absolute;pointer-events:none;z-index:0;width:70vw;height:70vw;max-width:900px;max-height:900px;right:-22vw;top:-28vw;border-radius:50%;background:radial-gradient(closest-side,rgba(255,130,60,.20),rgba(255,106,19,.04) 60%,transparent);filter:blur(24px);animation:leak 16s ease-in-out infinite alternate}
.contact-page::after{left:-24vw;right:auto;top:auto;bottom:-30vw;background:radial-gradient(closest-side,rgba(110,80,255,.12),transparent 70%)}
@keyframes leak{to{transform:translate(-5vw,7vh) scale(1.12)}}
/* 立体卡片：鼠标倾斜 */
.card,.service-card,.pn,.home-path{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .75s var(--ease-cine),border-color .45s,box-shadow .75s}
.card:hover,.service-card:hover{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px)}
.pn:hover{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-8px) scale(1.01)}
.home-path:hover{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-8px)}
/* 按钮：流光扫过 + 磁吸 */
.btn{transition:transform .6s var(--ease-cine),box-shadow .6s,background .4s,color .4s,border-color .4s,translate .5s var(--ease-soft)}
.pri{position:relative;overflow:hidden;isolation:isolate}
.pri::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-120%);transition:transform 1.1s var(--ease-cine)}
.pri:hover::after{transform:translateX(120%)}
/* 导航：滚动后毛玻璃加深 */
nav{transition:background .6s,box-shadow .6s}
nav.scrolled{box-shadow:0 14px 40px -14px rgba(7,7,15,.35)}
/* 鼠标光晕 */
#cineGlow{position:fixed;left:0;top:0;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(closest-side,rgba(255,106,19,.10),rgba(255,106,19,.03) 55%,transparent);will-change:transform}
@media(max-width:860px){.card,.service-card,.pn,.home-path,.card:hover,.service-card:hover,.pn:hover,.home-path:hover{transform:none!important}#cineGlow{display:none}body::after{opacity:.04}.about-home::after,.contact-page::after{width:110vw;height:110vw}}

/* ===== 能源资产页：动效对齐并超越用能企业页 ===== */
/* 面板：电影式横向揭开 */
.asset-visual .panel-svg{clip-path:inset(0 100% 0 0);transition:clip-path 1.7s var(--ease-cine) .2s}
.asset-visual.motion-in .panel-svg{clip-path:inset(0 0 0 0)}
/* 曲线：描线生长（pathLength 由脚本统一为 100） */
.asset-visual .panel-svg path[stroke]{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 2s var(--ease-cine) .5s}
.asset-visual.motion-in .panel-svg path[stroke]{stroke-dashoffset:0}
.asset-visual.motion-in .panel-svg path[stroke]:nth-of-type(2){transition-delay:.75s}
.asset-visual.motion-in .panel-svg path[stroke]:nth-of-type(3){transition-delay:.95s}
/* 填充区与点位：淡入 */
.asset-visual .panel-svg path[fill]:not([stroke]),.asset-visual .panel-svg circle,.asset-visual .panel-svg rect{opacity:0;transition:opacity 1.1s ease .9s}
.asset-visual.motion-in .panel-svg path[fill]:not([stroke]),.asset-visual.motion-in .panel-svg circle,.asset-visual.motion-in .panel-svg rect{opacity:1}
/* 扫描光线：面板内一道光缓慢下扫 */
.asset-visual.motion-in .biz-panel::after{content:"";position:absolute;left:0;right:0;top:0;height:90px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,138,66,.10),transparent);transform:translateY(-100%);animation:assetScan 5.5s ease-in-out 2.2s infinite}

/* 节点：依次升起，带模糊对焦 */
.asset-visual .asset-node{opacity:0;filter:blur(8px)}
.asset-visual.motion-in .asset-node{opacity:1}
.asset-visual.motion-in .asset-node.an3{animation:nodeRise 1.1s var(--ease-cine) .9s both,metricFloat 6.5s ease-in-out 2.1s infinite}
.asset-visual.motion-in .asset-node.an1{animation:nodeRise 1.1s var(--ease-cine) 1.1s both,metricFloat 7s ease-in-out 2.3s infinite}
.asset-visual.motion-in .asset-node.an2{animation:nodeRise 1.1s var(--ease-cine) 1.3s both,metricFloat 8s ease-in-out 2.5s infinite}
@keyframes nodeRise{from{opacity:0;filter:blur(8px);translate:0 36px;scale:.86}to{opacity:1;filter:blur(0);translate:0 0;scale:1}}
/* 底座：轨道环 */
.asset-visual .biz-orb::after{content:"";position:absolute;inset:-16%;border-radius:50%;border:1px dashed rgba(255,138,66,.30);pointer-events:none;animation:orbitSpin 28s linear infinite}
.asset-visual .biz-orb::before{content:"";position:absolute;inset:-34%;border-radius:50%;border:1px solid rgba(255,138,66,.12);pointer-events:none;animation:orbitSpin 40s linear infinite reverse}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
